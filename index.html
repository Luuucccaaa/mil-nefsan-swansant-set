620 009, à Paris, et là encore avec la mention : « Guadeloupe ». Mais je vais répéter le numéro de ce compte chèque postal : 5 620 009, à Paris.\n\n Le Secours populaire français enfin reçoit des dons en espèces au compte chèque postal 654 37, toujours à Paris. Le ministre chargé des départements et territoires d’outre-mer, M. Pierre Bilotte, quittera lundi matin Paris pour Pointe-à-Pitre. \n\nMauvais temps également sur la Côte d’Azur, mais en beaucoup moins grave, une trombe d’eau…"

  <script src="script_static.js"></script>

  <!-- ── Script intro : phrase mot par mot → fondu → audio créole ── -->
  <script>
    (function() {
      const introScreen = document.getElementById('intro-screen');
      const mainContent  = document.getElementById('main-content');
      const step1        = document.getElementById('intro-step1');
      const step2        = document.getElementById('intro-step2');
      const sentenceEl   = document.getElementById('intro-sentence');
      const arrowBtn     = document.getElementById('intro-arrow-btn');
      const creoleEl     = document.getElementById('intro-creole');
      const progressWrap = document.getElementById('intro-audio-progress-wrap');
      const progressFill = document.getElementById('intro-audio-progress-fill');
      const skipBtn       = document.getElementById('intro-skip-btn');

      // ↓ Remplacez par le nom de votre fichier audio
      const audio = new Audio('franceinter_emeutes.mp3');
      let rafId = null;

      // ── Bypass intro si ?skip ou ?edit dans l'URL ──
      // (le mode édition a besoin que #main-content soit visible pour
      // pouvoir positionner/redimensionner les médias)
      const urlParams = new URLSearchParams(window.location.search);
      if (urlParams.has('skip') || urlParams.has('edit')) {
        introScreen.style.display = 'none';
        mainContent.style.display = 'block';
        mainContent.style.opacity = '1';
        return;
      }

      // ── Étape 1 : révélation de la phrase mot par mot ──────────────
      const sentenceParts = [
        "Le 26 mai 1967 à Pointe-à-Pitre, un CRS reçoit un projectile dans le visage.",
        "Les policiers décident d’ouvrir le feu sur la foule de manifestants."
      ];
      const wordEls = [];

      sentenceParts.forEach((part, partIdx) => {
        part.split(' ').forEach(text => {
          const span = document.createElement('span');
          span.className = 'intro-word';
          span.textContent = text;
          if (text.replace(/[.,]/g, '') === '1967') span.classList.add('intro-word-1967');
          sentenceEl.appendChild(span);
          sentenceEl.appendChild(document.createTextNode(' '));
          wordEls.push(span);
        });
        if (partIdx < sentenceParts.length - 1) {
          sentenceEl.appendChild(document.createElement('br'));
        }
      });

      let i = 0;
      function revealNext() {
        if (i < wordEls.length) {
          wordEls[i].classList.add('shown');
          i++;
          setTimeout(revealNext, 130);
        } else {
          setTimeout(() => arrowBtn.classList.add('shown'), 500);
        }
      }
      setTimeout(revealNext, 500);

      // ── Clic sur la flèche : le texte disparaît, puis "1967" seul ──
      // Durées lues directement depuis les variables CSS en haut du <style>
      // (rien à toucher ici si on modifie juste les valeurs CSS)
      function readMs(varName, fallback) {
        const raw = getComputedStyle(introScreen).getPropertyValue(varName).trim();
        if (!raw) return fallback;
        return raw.endsWith('ms') ? parseFloat(raw) : parseFloat(raw) * 1000;
      }
      const fadeWordMs  = readMs('--intro-fade-word-duration', 600);
      const pause1967Ms = readMs('--intro-1967-pause', 350);
      const fade1967Ms  = readMs('--intro-fade-1967-duration', 800);

      const word1967  = wordEls.find(el => el.classList.contains('intro-word-1967'));
      const otherWords = wordEls.filter(el => el !== word1967);

      arrowBtn.addEventListener('click', () => {
        arrowBtn.classList.remove('shown');

        // 1. Tout le texte disparaît, sauf "1967"
        otherWords.forEach(el => el.classList.remove('shown'));

        // 2. Après une petite pause, "1967" disparaît seul
        setTimeout(() => {
          if (word1967) {
            word1967.classList.add('fade-1967');
            word1967.classList.remove('shown');
          }

          // 3. Une fois "1967" disparu à son tour, on passe à l'audio
          setTimeout(() => {
            step1.style.display = 'none';
            step2.style.display = 'flex';
            requestAnimationFrame(() => {
              creoleEl.classList.add('shown');
              progressWrap.classList.add('shown');
            });
            audio.play().catch(() => {});
            rafId = requestAnimationFrame(tick);
          }, fade1967Ms + 150);

        }, fadeWordMs + pause1967Ms);
      });

      function tick() {
        if (audio.duration) progressFill.style.width = (audio.currentTime / audio.duration * 100) + '%';
        rafId = requestAnimationFrame(tick);
      }

      // ── Fin de l'audio créole : on révèle la page principale ──────
      function showMain() {
        cancelAnimationFrame(rafId);
        introScreen.style.transition = 'opacity 0.8s ease';
        introScreen.style.opacity = '0';
        setTimeout(() => {
          introScreen.style.display = 'none';
          mainContent.style.display = 'block';
          // petit délai pour que le display:block soit peint avant le fondu
          requestAnimationFrame(() => {
            mainContent.style.opacity = '1';
          });
        }, 800);
        audio.pause();
      }

      audio.addEventListener('ended', showMain);
      skipBtn.addEventListener('click', () => {
        audio.pause();
        showMain();
      });
    })();
  </script>
</body>
